<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板</title>
  
  <style>
    /* ==========================================
       【1. 視覺主題設定 - 咖啡色馬卡龍配色】
       方便後續修改顏色與主題風格
       ========================================== */
    :root {
      --bg-color: #f7f1eb;          /* 網頁背景色：溫和燕麥奶色 */
      --header-title: #4a3525;      /* 標題文字：深可可棕 */
      --card-bg-1: #e2c0b0;        /* 馬卡龍草莓可可 */
      --card-bg-2: #dfd3c3;        /* 馬卡龍香草拿鐵 */
      --card-bg-3: #c2a68c;        /* 馬卡龍摩卡奶茶 */
      --card-bg-4: #d8c4b6;        /* 馬卡龍烤榛果 */
      --card-text: #3d2b1f;        /* 卡片文字：深濃縮咖啡色 */
      --card-time: #7d6350;        /* 時間文字：淺咖啡色 */
      --highlight-border: #8c5a3c;  /* 輪播高亮邊框：焦糖棕色 */
      --highlight-glow: rgba(140, 90, 60, 0.4); /* 高亮發光光暈 */
    }

    /* 基礎頁面重置與字型設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--card-text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    /* 頁面標題區塊 */
    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      color: var(--header-title);
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      letter-spacing: 1.5px;
    }

    header p {
      color: var(--card-time);
      font-size: 0.95rem;
    }

    /* ==========================================
       【2. 載入中酷炫動畫 (Loading Animation)】
       ========================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 0;
    }

    /* 馬卡龍旋轉氣泡特效 */
    .macaron-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #e2c0b0;
      border-top: 5px solid #4a3525;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loading p {
      color: var(--header-title);
      font-weight: bold;
      letter-spacing: 1px;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* ==========================================
       【3. 瀑布流排版 (Masonry Layout)】
       ========================================== */
    .masonry-wall {
      /* 設定響應式多欄排列 */
      column-count: 4;          /* 預設 4 欄 */
      column-gap: 1.5rem;       /* 卡片之間的左右間距 */
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 響應式斷點調整欄數 */
    @media (max-width: 1024px) {
      .masonry-wall { column-count: 3; }
    }
    @media (max-width: 768px) {
      .masonry-wall { column-count: 2; }
    }
    @media (max-width: 480px) {
      .masonry-wall { column-count: 1; }
    }

    /* ==========================================
       【4. 留言卡片樣式與動態輪播效果】
       ========================================== */
    .message-card {
      break-inside: avoid;      /* 關鍵：防止卡片被斷開到另一欄 */
      margin-bottom: 1.5rem;    /* 卡片之間的上下間距 */
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(74, 53, 37, 0.08);
      transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1); /* 平滑過渡動畫 */
      opacity: 0.85;            /* 未被選中時稍微淡化 */
      transform: scale(0.98);
      filter: blur(0.5px);      /* 未選中時微模糊，營造焦點感 */
    }

    /* 隨機動態套用的咖啡馬卡龍背景色 */
    .color-0 { background-color: var(--card-bg-1); }
    .color-1 { background-color: var(--card-bg-2); }
    .color-2 { background-color: var(--card-bg-3); }
    .color-3 { background-color: var(--card-bg-4); }

    /* 卡片內部元件 */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      border-bottom: 1px dashed rgba(61, 43, 31, 0.2);
      padding-bottom: 0.5rem;
    }

    .card-author {
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--card-text);
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--card-time);
    }

    .card-content {
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;   /* 保留留言中的換行符號 */
      word-break: break-word;  /* 自動斷詞，避免長文字溢出 */
    }

    /* 【重點】輪播高亮 (Highlight) 效果類別 */
    .message-card.highlight {
      opacity: 1;
      transform: scale(1.05);   /* 放大卡片 */
      filter: blur(0px);        /* 清晰顯示 */
      border: 2px solid var(--highlight-border);
      box-shadow: 0 10px 25px var(--highlight-glow);
      z-index: 10;              /* 確保發光時層級置頂 */
    }
  </style>
</head>
<body>

  <!-- 標題區 -->
  <header>
    <h1>☕ 咖啡馬卡龍留言牆</h1>
    <p>溫馨的回憶與悄悄話輪播中...</p>
  </header>

  <!-- 載入中提示動畫 -->
  <div id="loading">
    <div class="macaron-spinner"></div>
    <p>讀取留言中...</p>
  </div>

  <!-- 瀑布流卡片牆容器 -->
  <main id="wall" class="masonry-wall" style="display: none;"></main>

  <script>
    /* ==========================================
       【5. 參數設定區】 (可自行依需求調整)
       ========================================== */
    // Google 試算表 CSV 網址
    const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRYEWFJwbtw6bOIgarCzSomiBH-NojrlSDreaDboy20uGNtx_YScQmm4a074WoWLQQ4mDur4-mJ4FJB/pub?output=csv';
    
    // 【輪播秒數設定】預設 3000毫秒 (3秒) 換下一張高亮
    const CAROUSEL_INTERVAL = 3000; 

    // 全局變數
    let messages = [];
    let currentIndex = 0;
    let carouselTimer = null;

    /* ==========================================
       【6. CSV 解析器 (相容留言內含逗號與換行)】
       ========================================== */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let currentField = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        // 處理引號
        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentField += '"';
            i++; // 跳過下一個雙引號
          } else {
            insideQuotes = !insideQuotes;
          }
        } 
        // 處理逗號 (在雙引號內的逗號不分割)
        else if (char === ',' && !insideQuotes) {
          row.push(currentField.trim());
          currentField = '';
        } 
        // 處理換行 (在雙引號內的換行保留)
        else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') {
            i++; // 跳過 CRLF 的 \n
          }
          row.push(currentField.trim());
          if (row.length > 1 || row[0] !== '') {
            lines.push(row);
          }
          row = [];
          currentField = '';
        } 
        else {
          currentField += char;
        }
      }

      if (currentField || row.length > 0) {
        row.push(currentField.trim());
        lines.push(row);
      }

      return lines;
    }

    /* ==========================================
       【7. 載入資料與動態生成卡片】
       ========================================== */
    async function fetchMessages() {
      try {
        const response = await fetch(SPREADSHEET_CSV_URL);
        const csvData = await response.text();
        const parsedRows = parseCSV(csvData);

        // 跳過標頭列 (第一行：時間戳記、名字、悄悄話)
        const dataRows = parsedRows.slice(1);

        // 格式化資料為物件陣列
        messages = dataRows.map(row => ({
          timestamp: row[0] || '',
          name: row[1] || '匿名朋友',
          message: row[2] || ''
        })).filter(item => item.message !== ''); // 過濾空留言

        renderCards();
        startCarousel();

      } catch (error) {
        console.error('讀取 CSV 失敗:', error);
        document.getElementById('loading').innerHTML = '<p>讀取留言失敗，請確認網路或試算表權限。</p>';
      }
    }

    // 將資料渲染進 DOM
    function renderCards() {
      const wall = document.getElementById('wall');
      const loading = document.getElementById('loading');

      if (messages.length === 0) {
        loading.innerHTML = '<p>目前還沒有任何留言喔！</p>';
        return;
      }

      wall.innerHTML = ''; // 清空內容

      messages.forEach((item, index) => {
        const card = document.createElement('div');
        // 隨機指定 0~3 的馬卡龍配色風格
        const colorClass = `color-${index % 4}`;
        card.className = `message-card ${colorClass}`;
        card.dataset.index = index;

        // 格式化時間（如果格式完整就簡化顯示）
        const timeDisplay = item.timestamp.split(' ')[0] || item.timestamp;

        card.innerHTML = `
          <div class="card-header">
            <span class="card-author">${escapeHTML(item.name)}</span>
            <span class="card-time">${escapeHTML(timeDisplay)}</span>
          </div>
          <div class="card-content">${escapeHTML(item.message)}</div>
        `;

        wall.appendChild(card);
      });

      // 隱藏 Loading 動畫，顯示瀑布流牆
      loading.style.display = 'none';
      wall.style.display = 'block';
    }

    /* 防範 XSS 攻擊的字串處理 */
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /* ==========================================
       【8. 隨時間輪播高亮 (Highlight) 特效】
       ========================================== */
    function startCarousel() {
      const cards = document.querySelectorAll('.message-card');
      if (cards.length === 0) return;

      // 初始高亮第一張
      highlightCard(0);

      // 設定定時器：每隔指定時間讓下一張卡片高亮
      carouselTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % cards.length;
        highlightCard(currentIndex);
      }, CAROUSEL_INTERVAL);
    }

    function highlightCard(index) {
      const cards = document.querySelectorAll('.message-card');

      cards.forEach((card, i) => {
        if (i === index) {
          card.classList.add('highlight');
          
          // 平滑滾動畫面以確保高亮卡片保持在可視區域 ( optional 增強體驗 )
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          card.classList.remove('highlight');
        }
      });
    }

    // 頁面載入後自動觸發主程式
    window.addEventListener('DOMContentLoaded', fetchMessages);
  </script>
</body>
</html>
