<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板 | Macaron Coffee Message Wall</title>
  
  <!-- Google Fonts: 導入圓潤且具溫暖感與手寫質感的字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. 顏色與主題設定 (咖啡色馬卡龍主題，方便在此自訂顏色)
       ========================================================= */
    :root {
      /* 背景主色：溫暖濃郁的榛果拿鐵色 */
      --bg-color: #f7f3ee;
      --bg-pattern-dot: #e6ded6;

      /* 馬卡龍卡片配色庫 (旋轉套用，營造甜點盤質感) */
      --macaron-espresso: #5c4033;   /* 濃縮咖啡深棕 (主要文字/邊框) */
      --macaron-mocha: #8b5a2b;      /* 摩卡暖棕 */
      --macaron-caramel: #c8963e;    /* 焦糖黃金 */
      --macaron-cream: #fffaf5;      /* 鮮奶油米白 (卡片底色) */
      --macaron-pink: #f4dcd6;       /* 草莓咖啡馬卡龍粉 */
      --macaron-pistachio: #e2e7d7;  /* 開心果淺綠 */
      --macaron-toast: #f2e3d5;      /* 奶茶烘焙色 */

      /* 動態亮燈 (Highlight) 主題色 */
      --highlight-border: #d4a373;   /* 亮起時的金黃焦糖邊框 */
      --highlight-glow: rgba(212, 163, 115, 0.45); /* 金黃光暈 */

      /* 字型設定 */
      --font-main: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* =========================================================
       2. 基礎排版與背景設定
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      /* 馬卡龍柔和點陣背景 */
      background-image: radial-gradient(var(--bg-pattern-dot) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: var(--macaron-espresso);
      font-family: var(--font-main);
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .title {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--macaron-espresso);
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.8);
    }

    .subtitle {
      font-size: 1rem;
      color: var(--macaron-mocha);
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* =========================================================
       3. 載入中動畫 (Loading Animation)
       ========================================================= */
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 60px;
      gap: 18px;
    }

    /* 咖啡杯馬卡龍旋轉動態 */
    .cup-spinner {
      width: 56px;
      height: 56px;
      border: 5px solid var(--macaron-toast);
      border-top: 5px solid var(--macaron-mocha);
      border-radius: 50%;
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--macaron-mocha);
      letter-spacing: 1.2px;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* =========================================================
       4. 瀑布流排版 (Masonry Layout)
       ========================================================= */
    .masonry-wall {
      width: 100%;
      max-width: 1200px;
      /* CSS 瀑布流欄位設定 */
      column-count: 4;          /* 預設 4 欄 */
      column-gap: 20px;          /* 欄與欄的間距 */
      margin: 0 auto;
      transition: all 0.5s ease;
    }

    /* 響應式斷點 (RWD) */
    @media (max-width: 1024px) { .masonry-wall { column-count: 3; } }
    @media (max-width: 768px)  { .masonry-wall { column-count: 2; } }
    @media (max-width: 480px)  { .masonry-wall { column-count: 1; } }

    /* =========================================================
       5. 留言卡片視覺與輪播特效 (Highlight Effects)
       ========================================================= */
    .card {
      /* 防止卡片在瀑布流中被拆斷到下一欄 */
      break-inside: avoid;
      margin-bottom: 20px;

      background: var(--macaron-cream);
      border: 2.5px solid var(--macaron-toast);
      border-radius: 20px;
      padding: 22px 20px;
      box-shadow: 0 6px 15px rgba(92, 64, 51, 0.06);

      /* 平滑過渡動畫 (用於縮放、亮度與陰影變化) */
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1),
                  box-shadow 0.6s ease,
                  filter 0.6s ease,
                  opacity 0.6s ease,
                  border-color 0.6s ease;
      
      position: relative;
      cursor: default;
    }

    /* 卡片頭部：姓名與圖示 */
    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1.5px dashed var(--macaron-toast);
    }

    .avatar-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--macaron-toast);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .author-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--macaron-espresso);
    }

    /* 卡片內容：悄悄話 */
    .card-body {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #4a382c;
      white-space: pre-wrap; /* 保留換行 */
      word-break: break-word;
    }

    /* 時間標籤 */
    .card-time {
      font-size: 0.75rem;
      color: #a08c7d;
      margin-top: 12px;
      text-align: right;
    }

    /* ---------------------------------------------------------
       重點特效：當卡片被選中 (Focused/Highlighted) 時的樣式
       --------------------------------------------------------- */
    .card.highlight {
      transform: scale(1.08) zIndex(10);
      border-color: var(--highlight-border);
      box-shadow: 0 15px 35px var(--highlight-glow),
                  0 0 20px rgba(212, 163, 115, 0.3);
      filter: brightness(1.05) contrast(1.02);
      opacity: 1;
      z-index: 5;
    }

    /* 當有卡片被選中時，其他未被選中 (Dimmed) 的卡片樣式 */
    .masonry-wall.has-active .card:not(.highlight) {
      opacity: 0.45;            /* 透明度降低 */
      filter: blur(1.2px) grayscale(20%); /* 輕微模糊與降飽和度 */
      transform: scale(0.97);   /* 微幅度縮小 */
    }
  </style>
</head>
<body>

  <!-- 網頁標頭區域 -->
  <header>
    <h1 class="title">☕ 朋友對我的動態留言板</h1>
    <p class="subtitle"><span>🍬</span> Macaron Coffee Portfolio Wall <span>✨</span></p>
  </header>

  <!-- 讀取中動畫 (資料加載完成後會由 JS 隱藏) -->
  <div id="loading-container">
    <div class="cup-spinner"></div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <!-- 瀑布流卡片牆 -->
  <main class="masonry-wall" id="cards-container"></main>

  <script>
    /* =========================================================
       6. 參數設定區 (可依需求自行調整)
       ========================================================= */
    // Google 試算表 CSV 發布網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRYEWFJwbtw6bOIgarCzSomiBH-NojrlSDreaDboy20uGNtx_YScQmm4a074WoWLQQ4mDur4-mJ4FJB/pub?output=csv';
    
    // 【輪播秒數控制】單位：毫秒 (3000ms = 3 秒)
    const ROTATE_INTERVAL_MS = 3000;

    // 馬卡龍微調顏色背景庫 (給卡片動態輪替使用)
    const cardBgColors = [
      '#fffaf5', // 鮮奶油米白
      '#f9f3ec', // 歐蕾奶茶
      '#f5ece5', // 燕麥拿鐵
      '#f2e8de'  // 輕烘焙馬卡龍
    ];

    // 頭像表情圖示庫
    const avatarIcons = ['☕', '🍩', '🧁', '🍪', '🍮', '🍰', '🍫', '🥐'];

    /* =========================================================
       7. 強健的 CSV 解析函式 (支援處理雙引號、逗號與換行)
       ========================================================= */
    function parseCSV(csvText) {
      const rows = [];
      let currentRow = [];
      let currentCell = '';
      let insideQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[charIdx(i)];
        const nextChar = csvText[i + 1];

        // 輔助取得當前字元
        function charIdx(idx) { return idx; }

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            // 轉義的雙引號 ("")
            currentCell += '"';
            i++; 
          } else {
            // 切換雙引號狀態
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          // 欄位分隔點
          currentRow.push(currentCell.trim());
          currentCell = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          // 行分隔點
          if (char === '\r' && nextChar === '\n') { i++; } // 處理 \r\n
          currentRow.push(currentCell.trim());
          if (currentRow.some(cell => cell.length > 0)) {
            rows.push(currentRow);
          }
          currentRow = [];
          currentCell = '';
        } else {
          currentCell += char;
        }
      }

      // 處理最後一筆資料
      if (currentCell || currentRow.length > 0) {
        currentRow.push(currentCell.trim());
        rows.push(currentRow);
      }

      return rows;
    }

    /* =========================================================
       8. 主程式邏輯：Fetch 資料、渲染與自動輪播
       ========================================================= */
    let cardElements = []; // 儲存生成的卡片 DOM
    let currentIndex = -1; // 當前 Highlight 的卡片索引
    let timerId = null;    // 計時器 ID

    async function initMessageBoard() {
      const loadingEl = document.getElementById('loading-container');
      const containerEl = document.getElementById('cards-container');

      try {
        // 1. Fetch CSV 資料
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('網路回應異常');
        const csvData = await response.text();

        // 2. 解析 CSV
        const parsedRows = parseCSV(csvData);

        // 移除 CSV 第一行 (標題列：時間戳記、姓名、悄悄話)
        const dataRows = parsedRows.slice(1);

        // 隱藏 Loading 動畫
        loadingEl.style.display = 'none';

        if (dataRows.length === 0) {
          containerEl.innerHTML = '<p style="text-align:center; width:100%; grid-column: 1/-1;">目前還沒有任何留言喔！</p>';
          return;
        }

        // 3. 動態渲染卡片
        dataRows.forEach((row, index) => {
          // row[0]: 時間戳記, row[1]: 姓名, row[2]: 悄悄話
          const timestamp = row[0] || '';
          const name = row[1] || '匿名朋友';
          const message = row[2] || '（這個人很神祕，沒有留下文字...）';

          // 隨機選擇頭像與背景顏色
          const avatar = avatarIcons[index % avatarIcons.length];
          const bgColor = cardBgColors[index % cardBgColors.length];

          // 建立卡片 HTML 結構
          const card = document.createElement('div');
          card.className = 'card';
          card.style.backgroundColor = bgColor;
          
          card.innerHTML = `
            <div class="card-header">
              <div class="avatar-icon">${avatar}</div>
              <div class="author-name">${escapeHTML(name)}</div>
            </div>
            <div class="card-body">${escapeHTML(message)}</div>
            ${timestamp ? `<div class="card-time">${escapeHTML(timestamp)}</div>` : ''}
          `;

          containerEl.appendChild(card);
          cardElements.push(card);
        });

        // 4. 啟動自動輪播 Focus 特效
        startCarousel(containerEl);

      } catch (error) {
        console.error('讀取留言板失敗:', error);
        loadingEl.innerHTML = `<p style="color: #b33939; font-weight: bold;">載入留言失敗，請確認網路連線或試算表網址是否正確。</p>`;
      }
    }

    /* =========================================================
       9. 隨時間輪播特效邏輯 (Highlight Rotation)
       ========================================================= */
    function startCarousel(containerEl) {
      if (cardElements.length === 0) return;

      // 標示牆面當前有卡片處於 active 狀態 (觸發其他卡片變暗的 CSS)
      containerEl.classList.add('has-active');

      function highlightNextCard() {
        // 移除上一張卡片的 highlight 類別
        if (currentIndex >= 0 && cardElements[currentIndex]) {
          cardElements[currentIndex].classList.remove('highlight');
        }

        // 算下一張卡片的 index (循環)
        currentIndex = (currentIndex + 1) % cardElements.length;

        // 加上 Highlight 特效
        const currentCard = cardElements[currentIndex];
        currentCard.classList.add('highlight');

        // 自動平滑滾動至亮起卡片的位置 (若不在可視範圍內)
        currentCard.scrollIntoView({
          behavior: 'smooth',
          block: 'nearest'
        });
      }

      // 立即執行第一次 highlight
      highlightNextCard();

      // 設定計時器，每隔指定秒數自動更換
      timerId = setInterval(highlightNextCard, ROTATE_INTERVAL_MS);
    }

    // 簡單的 XSS 防護字串轉義工具
    function escapeHTML(str) {
