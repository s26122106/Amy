<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人數位名片 - 謝函容</title>
  
  <style>
    /* 1. 全域基本設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* 使用奶茶色/淡棕色馬卡龍系的背景 */
      background-color: #f7f1eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      
      /* 讓卡片在整個螢幕畫面中完全置中 */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 2. 名片卡片主體 */
    .card {
      /* 暖可可色/淺馬卡龍棕背景 */
      background-color: #ffffff;
      width: 90%;
      max-width: 350px; /* 限制最大寬度，呈現現代簡約比例 */
      padding: 35px 25px;
      border-radius: 24px; /* 大圓角現代感 */
      
      /* 圓潤柔和的雙層柔和陰影 */
      box-shadow: 0 10px 25px rgba(160, 120, 90, 0.12), 
                  0 4px 10px rgba(0, 0, 0, 0.03);
      
      /* 卡片內部元素置中 */
      text-align: center;
      
      /* 微調懸浮效果 */
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px); /* 滑鼠游移時微微上升 */
    }

    /* 3. 圓形大頭貼 */
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%; /* 變成完美正圓形 */
      object-fit: cover; /* 確保照片不會拉傷變形 */
      margin-bottom: 20px;
      
      /* 給頭像外圍加一圈馬卡龍淺粉棕色邊框 */
      border: 4px solid #ede0d4;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    /* 4. 名字與自我介紹 */
    .name {
      font-size: 1.5rem;
      color: #4a3b32; /* 深馬卡龍棕色，比純黑更有質感 */
      margin-bottom: 8px;
      font-weight: 600;
    }

    .bio {
      font-size: 0.9rem;
      color: #8c7a6b; /* 中度灰棕色，營造層次感 */
      line-height: 1.5;
      margin-bottom: 25px;
    }

    /* 5. 按鈕區塊與按鈕樣式 */
    .button-group {
      display: flex;
      flex-direction: column; /* 按鈕垂直排列 */
      gap: 12px; /* 按鈕之間的間隔 */
    }

    .btn {
      display: block;
      padding: 12px 20px;
      border-radius: 50px; /* 膠囊形狀圓角按鈕 */
      text-decoration: none; /* 移除超連結底線 */
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    /* Instagram 按鈕：淺暖咖啡棕色 */
    .btn-instagram {
      background-color: #b08968;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(176, 137, 104, 0.25);
    }

    .btn-instagram:hover {
      background-color: #9c7353;
      box-shadow: 0 6px 15px rgba(176, 137, 104, 0.35);
    }

    /* Email 按鈕：馬卡龍燕麥奶色 */
    .btn-email {
      background-color: #e6ccb2;
      color: #5c4738;
      box-shadow: 0 4px 12px rgba(230, 204, 178, 0.3);
    }

    .btn-email:hover {
      background-color: #ddbf9f;
    }
  </style>
</head>
<body>

  <!-- 名片主體容器 -->
  <div class="card">
    <!-- 圓形大頭貼 -->
    <img src="https://i.postimg.cc/L62d7W6T/1000004951.jpg" alt="大頭貼" class="avatar">
    
    <!-- 名字 -->
    <h1 class="name">謝函容</h1>
    
    <!-- 自我介紹 -->
    <p class="bio">熱愛烘焙</p>
    
    <!-- 按鈕區塊 -->
    <div class="button-group">
      <!-- 請將 href 裡的網址替換成你的 Instagram 個人頁面連結 -->
      <a href="https://www.instagram.com" target="_blank" class="btn btn-instagram">Instagram</a>
      
      <!-- 請將 mailto: 後面替換成你的 Email 信箱 -->
      <a href="mailto:your-email@example.com" class="btn btn-email">Email Me</a>
    </div>
  </div>

</body>
</html>
