<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端心電感應 | Cloud Telepathy</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            notion: {
              bg: '#FBF9F5',
              card: '#FFFFFF',
              sidebar: '#F4EFE6',
              border: '#E6E0D4',
              hover: '#EFE9DD',
              text: '#37352F',
              muted: '#787774',
              accent: '#8C6D46',
              accentHover: '#735735',
              accentLight: '#F3EDE2',
              tagGreen: '#E6F4EA',
              tagGreenText: '#137333',
              tagYellow: '#FEF7E0',
              tagYellowText: '#B06000'
            }
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FBF9F5;
      color: #37352F;
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
    }

    /* 3D Flip Card Effect */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* Notion style custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.02);
    }
    ::-webkit-scrollbar-thumb {
      background: #E6E0D4;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #D5CEBF;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-notion-accentLight">

  <!-- Main Layout Container -->
  <div class="max-w-4xl w-full mx-auto p-4 md:p-8 flex-1 flex flex-col">
    
    <!-- Top Header -->
    <header class="flex items-center justify-between border-b border-notion-border pb-4 mb-6">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-notion-accentLight border border-notion-border flex items-center justify-center text-notion-accent font-bold text-xl shadow-sm">
          🧠
        </div>
        <div>
          <h1 class="font-bold text-xl tracking-tight text-notion-text flex items-center gap-2">
            雲端心電感應
            <span class="text-xs px-2 py-0.5 rounded border border-notion-border bg-notion-sidebar text-notion-muted font-normal">Notion Style</span>
          </h1>
          <p class="text-xs text-notion-muted">多人默契遊戲 · 即時同步翻牌</p>
        </div>
      </div>

      <!-- Right Header Actions -->
      <div class="flex items-center space-x-2">
        <div id="roomBadge" class="hidden text-xs px-3 py-1.5 rounded-lg border border-notion-border bg-white text-notion-text flex items-center gap-1.5 font-medium shadow-sm">
          <i data-lucide="door-open" class="w-3.5 h-3.5 text-notion-muted"></i>
          房號: <span id="currentRoomCode" class="font-bold text-notion-accent">----</span>
          <button id="copyLinkBtn" title="複製房間連結" class="ml-1 text-notion-muted hover:text-notion-text transition-colors">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <!-- Secret Host Console Toggle Button -->
        <button id="toggleHostBtn" title="房主控制台切換 (隱藏按鈕)" class="p-2 rounded-lg border border-notion-border hover:bg-notion-hover text-notion-muted hover:text-notion-text transition-all duration-200">
          <i data-lucide="key-round" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- Hidden Host Control Console -->
    <div id="hostPanel" class="hidden mb-6 p-4 rounded-xl border border-notion-border bg-notion-sidebar shadow-sm transition-all duration-300">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pb-3 border-b border-notion-border/60">
        <div class="flex items-center gap-2">
          <span class="px-2 py-0.5 rounded bg-notion-accent text-white font-semibold text-xs">房主模式</span>
          <span class="text-xs text-notion-muted">掌控此房間的題目與開牌進度</span>
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <button id="hostRevealBtn" class="flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg bg-notion-accent hover:bg-notion-accentHover text-white text-xs font-medium flex items-center justify-center gap-1.5 transition-colors shadow-sm">
            <i data-lucide="eye" class="w-3.5 h-3.5"></i> 全網頁開牌 (Reveal)
          </button>
          <button id="hostResetBtn" class="flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg border border-notion-border bg-white hover:bg-notion-hover text-notion-text text-xs font-medium flex items-center justify-center gap-1.5 transition-colors">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> 下一輪 (Reset)
          </button>
        </div>
      </div>
      <div class="mt-3 flex items-center gap-2">
        <input id="hostQuestionInput" type="text" placeholder="輸入題目 (例: 提到黃色水果會想到什麼？)" class="flex-1 px-3 py-2 text-sm rounded-lg border border-notion-border bg-white focus:outline-none focus:ring-2 focus:ring-notion-accent/30 text-notion-text">
        <button id="hostSetQuestionBtn" class="px-4 py-2 rounded-lg border border-notion-border bg-white hover:bg-notion-accentLight text-notion-text hover:text-notion-accent font-medium text-xs whitespace-nowrap transition-colors shadow-sm">
          發布題目
        </button>
      </div>
    </div>

    <!-- MAIN APP CONTENT -->
    <main class="flex-1 flex flex-col justify-center">

      <!-- SCREEN 1: LOGIN & ROOM SELECTOR -->
      <section id="loginScreen" class="max-w-md mx-auto w-full bg-white p-6 md:p-8 rounded-2xl border border-notion-border shadow-sm">
        <div class="text-center mb-6">
          <h2 class="text-xl font-bold text-notion-text mb-1">加入或創建房間</h2>
          <p class="text-xs text-notion-muted">請輸入您的暱稱與房間號碼開始遊戲</p>
        </div>

        <form id="joinForm" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-notion-muted mb-1">玩家暱稱</label>
            <div class="relative">
              <input type="text" id="playerNameInput" required placeholder="例如: 小明" class="w-full pl-9 pr-3 py-2.5 text-sm rounded-xl border border-notion-border bg-notion-bg focus:bg-white focus:outline-none focus:ring-2 focus:ring-notion-accent/30 text-notion-text">
              <i data-lucide="user" class="w-4 h-4 text-notion-muted absolute left-3 top-3"></i>
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-notion-muted mb-1">房間代碼</label>
            <div class="flex gap-2">
              <div class="relative flex-1">
                <input type="text" id="roomCodeInput" required placeholder="例如: 8888" class="w-full pl-9 pr-3 py-2.5 text-sm rounded-xl border border-notion-border bg-notion-bg focus:bg-white focus:outline-none focus:ring-2 focus:ring-notion-accent/30 text-notion-text uppercase font-mono tracking-wider">
                <i data-lucide="hash" class="w-4 h-4 text-notion-muted absolute left-3 top-3"></i>
              </div>
              <button type="button" id="randomRoomBtn" class="px-3 py-2.5 border border-notion-border rounded-xl hover:bg-notion-hover text-xs font-medium text-notion-text transition-colors flex items-center gap-1">
                <i data-lucide="shuffle" class="w-3.5 h-3.5"></i> 隨機
              </button>
            </div>
          </div>

          <div class="pt-2">
            <button type="submit" class="w-full py-3 bg-notion-accent hover:bg-notion-accentHover text-white rounded-xl text-sm font-semibold transition-colors shadow-sm flex items-center justify-center gap-2">
              <i data-lucide="log-in" class="w-4 h-4"></i> 進入房間
            </button>
          </div>
        </form>
      </section>

      <!-- SCREEN 2: GAME ROOM INTERFACE -->
      <section id="gameScreen" class="hidden space-y-6">

        <!-- Question Banner -->
        <div class="bg-white p-6 rounded-2xl border border-notion-border shadow-sm text-center relative overflow-hidden">
          <div class="absolute top-0 left-0 w-full h-1 bg-notion-accent"></div>
          <div id="statusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-notion-tagYellow text-notion-tagYellowText mb-3">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-ping"></span>
            <span id="statusText">等待房主出題中...</span>
          </div>
          <h2 id="displayQuestion" class="text-xl md:text-2xl font-bold text-notion-text min-h-[2.5rem] flex items-center justify-center">
            暫無題目
          </h2>
        </div>

        <!-- Answer Input Area (Visible when status is 'playing') -->
        <div id="answerSection" class="bg-white p-4 md:p-6 rounded-2xl border border-notion-border shadow-sm transition-all duration-300">
          <form id="answerForm" class="flex flex-col sm:flex-row gap-3">
            <input type="text" id="playerAnswerInput" placeholder="請輸入您的答案..." required class="flex-1 px-4 py-3 text-sm rounded-xl border border-notion-border bg-notion-bg focus:bg-white focus:outline-none focus:ring-2 focus:ring-notion-accent/30 text-notion-text">
            <button type="submit" id="submitAnswerBtn" class="px-6 py-3 bg-notion-accent hover:bg-notion-accentHover text-white rounded-xl text-sm font-semibold transition-all shadow-sm flex items-center justify-center gap-2 whitespace-nowrap">
              <i data-lucide="send" class="w-4 h-4"></i> 提交答案
            </button>
          </form>
          <div id="submittedNotice" class="hidden mt-3 text-center text-xs text-notion-muted flex items-center justify-center gap-1">
            <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-600"></i> 您已成功提交答案！可重複輸入更新。
          </div>
        </div>

        <!-- Cards Display Area -->
        <div>
          <div class="flex items-center justify-between mb-4 px-1">
            <h3 class="text-sm font-bold text-notion-text flex items-center gap-2">
              <i data-lucide="users" class="w-4 h-4 text-notion-muted"></i> 玩家卡片
              <span id="playerCount" class="text-xs bg-notion-sidebar px-2 py-0.5 rounded-full border border-notion-border text-notion-muted font-normal">0 人</span>
            </h3>
            <span class="text-xs text-notion-muted" id="revealHint">開牌時將自動觸發 3D CSS 翻牌動畫</span>
          </div>

          <!-- Cards Grid -->
          <div id="cardsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            <!-- Dynamic Cards inserted via JS -->
          </div>
        </div>

      </section>

    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 px-4 py-3 rounded-xl bg-notion-text text-white text-xs shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none flex items-center gap-2 z-50">
      <i data-lucide="info" class="w-4 h-4 text-notion-accentLight"></i>
      <span id="toastMsg">Notification</span>
    </div>

    <!-- Footer -->
    <footer class="mt-12 text-center text-xs text-notion-muted border-t border-notion-border/50 pt-4">
      Notion Style Cloud Telepathy &copy; 2026
    </footer>

  </div>

  <!-- JavaScript Logic -->
  <script>
    // Configuration
    const SHEET_NAME = 'TelepathyData';
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyWRoTipV-i23mpqiHZCxBKDyDRnzYFZMl-OY7yQjdRsyLiLP5R5y7h_tgf8asPu8kSgg/exec";

    // Application State
    let roomCode = "";
    let playerName = "";
    let isHost = false;
    let currentStatus = "setup"; // 'setup', 'playing', 'revealed'
    let currentQuestion = "";
    let currentAnswers = {};
    let pollingTimer = null;

    // DOM Elements
    const loginScreen = document.getElementById('loginScreen');
    const gameScreen = document.getElementById('gameScreen');
    const joinForm = document.getElementById('joinForm');
    const playerNameInput = document.getElementById('playerNameInput');
    const roomCodeInput = document.getElementById('roomCodeInput');
    const randomRoomBtn = document.getElementById('randomRoomBtn');
    const roomBadge = document.getElementById('roomBadge');
    const currentRoomCodeEl = document.getElementById('currentRoomCode');
    const copyLinkBtn = document.getElementById('copyLinkBtn');
    
    // Host Controls
    const toggleHostBtn = document.getElementById('toggleHostBtn');
    const hostPanel = document.getElementById('hostPanel');
    const hostQuestionInput = document.getElementById('hostQuestionInput');
    const hostSetQuestionBtn = document.getElementById('hostSetQuestionBtn');
    const hostRevealBtn = document.getElementById('hostRevealBtn');
    const hostResetBtn = document.getElementById('hostResetBtn');

    // Game Elements
    const displayQuestion = document.getElementById('displayQuestion');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const answerSection = document.getElementById('answerSection');
    const answerForm = document.getElementById('answerForm');
    const playerAnswerInput = document.getElementById('playerAnswerInput');
    const submittedNotice = document.getElementById('submittedNotice');
    const cardsGrid = document.getElementById('cardsGrid');
    const playerCount = document.getElementById('playerCount');

    // Initialize Lucide Icons
    lucide.createIcons();

    // Auto-fill Room Code from URL query param if present
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam) {
        roomCodeInput.value = roomParam.trim().toUpperCase();
      }
    });

    // Copy Room Link to Clipboard
    copyLinkBtn.addEventListener('click', () => {
      const url = window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => showToast("房間連結已複製到剪貼簿！"));
      } else {
        const input = document.createElement('input');
        input.value = url;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showToast("房間連結已複製到剪貼簿！");
      }
    });

    // Generate random 4-digit room code
    randomRoomBtn.addEventListener('click', () => {
      const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
      roomCodeInput.value = randomCode;
    });

    // Toggle Hidden Host Panel
    toggleHostBtn.addEventListener('click', () => {
      isHost = !isHost;
      if (isHost) {
        hostPanel.classList.remove('hidden');
        showToast("已啟用房主控制台權限");
      } else {
        hostPanel.classList.add('hidden');
        showToast("已關閉房主控制台");
      }
    });

    // Handle Join Room
    joinForm.addEventListener('submit', (e) => {
      e.preventDefault();
      playerName = playerNameInput.value.trim();
      roomCode = roomCodeInput.value.trim().toUpperCase();

      if (!playerName || !roomCode) return;

      // Update UI Header
      currentRoomCodeEl.textContent = roomCode;
      roomBadge.classList.remove('hidden');

      // Update URL query string without reloading page
      const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + roomCode;
      window.history.pushState({path: newUrl}, '', newUrl);

      // Switch Screens
      loginScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');

      // Immediate first fetch & start interval polling
      fetchRoomData();
      startPolling();
    });

    // Start 2-second Interval Polling
    function startPolling() {
      if (pollingTimer) clearInterval(pollingTimer);
      pollingTimer = setInterval(fetchRoomData, 2000);
    }

    // Fetch Room State (GET)
    async function fetchRoomData() {
      if (!roomCode) return;
      try {
        const response = await fetch(`${GAS_API_URL}?room=${encodeURIComponent(roomCode)}`);
        if (!response.ok) throw new Error("Network response was not ok");
        const data = await response.json();

        updateGameUI(data);
      } catch (err) {
        console.error("Polling fetch error:", err);
      }
    }

    // Post Game Action (POST)
    async function sendAction(payload) {
      try {
        payload.room = roomCode;
        
        // Optimistic UI update before request finishes
        if (payload.action === 'submit_answer') {
          currentAnswers[payload.playerName] = payload.answer;
          renderCards(currentAnswers, currentStatus === 'revealed');
        }

        try {
          // Primary attempt with standard CORS mode
          await fetch(GAS_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
        } catch (corsErr) {
          // Fallback to no-cors mode if CORS preflight fails in specific GAS deployments
          await fetch(GAS_API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
        }

        // Trigger sync immediately after sending
        setTimeout(fetchRoomData, 500);
      } catch (err) {
        console.error("Send action error:", err);
        showToast("傳送資料失敗，請重新嘗試");
      }
    }

    // Synchronize UI with received room data
    function updateGameUI(data) {
      currentStatus = data.status || "setup";
      currentQuestion = data.question || "";
      currentAnswers = data.answers || {};

      // Question Title
      displayQuestion.textContent = currentQuestion || (currentStatus === 'setup' ? "等待房主出題中..." : "暫無題目");

      // Status Badge Styling & Input controls visibility
      if (currentStatus === 'setup') {
        statusBadge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-notion-tagYellow text-notion-tagYellowText mb-3";
        statusText.textContent = "狀態: 等待出題 (Setup)";
        answerSection.classList.add('hidden');
      } else if (currentStatus === 'playing') {
        statusBadge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-blue-50 text-blue-700 border border-blue-200 mb-3";
        statusText.textContent = "狀態: 玩家填答中 (Playing)";
        answerSection.classList.remove('hidden');

        // Check if current player submitted
        if (currentAnswers[playerName] !== undefined) {
          submittedNotice.classList.remove('hidden');
        } else {
          submittedNotice.classList.add('hidden');
        }
      } else if (currentStatus === 'revealed') {
        statusBadge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-notion-tagGreen text-notion-tagGreenText mb-3";
        statusText.textContent = "狀態: 全體解答已開牌 (Revealed)";
        answerSection.classList.add('hidden');
      }

      // Render Cards grid
      renderCards(currentAnswers, currentStatus === 'revealed');
    }

    // Render Cards Grid & Trigger 3D Flip
    function renderCards(answers, isRevealed) {
      const playerNames = Object.keys(answers);
      playerCount.textContent = `${playerNames.length} 人`;

      if (playerNames.length === 0) {
        cardsGrid.innerHTML = `
          <div class="col-span-full py-12 text-center text-notion-muted text-xs border border-dashed border-notion-border rounded-xl">
            目前還沒有玩家加入填答...
          </div>
        `;
        return;
      }

      // Count answer frequencies to highlight matches
      const answerCounts = {};
      if (isRevealed) {
        Object.values(answers).forEach(ans => {
          const formattedAns = String(ans).trim().toLowerCase();
          if (formattedAns) {
            answerCounts[formattedAns] = (answerCounts[formattedAns] || 0) + 1;
          }
        });
      }

      const shouldFlip = isRevealed;

      let html = '';
      playerNames.forEach(name => {
        const ans = answers[name];
        const formattedAns = String(ans).trim().toLowerCase();
        const isCurrentPlayer = name === playerName;
        const isMatch = isRevealed && formattedAns && answerCounts[formattedAns] > 1;

        html += `
          <div class="h-40 perspective-1000">
            <div class="card-inner relative w-full h-full transform-style-3d ${shouldFlip ? 'rotate-y-180' : ''}">
              
              <!-- CARD FRONT (Covered / Submitted state) -->
              <div class="absolute inset-0 w-full h-full rounded-xl border ${isCurrentPlayer ? 'border-notion-accent bg-notion-accentLight/40' : 'border-notion-border bg-white'} p-4 flex flex-col justify-between items-center text-center shadow-sm backface-hidden">
                <div class="w-10 h-10 rounded-full bg-notion-sidebar border border-notion-border flex items-center justify-center text-sm font-bold text-notion-text">
                  ${escapeHtml(name.charAt(0))}
                </div>
                <div class="font-medium text-xs text-notion-text truncate w-full px-1">
                  ${escapeHtml(name)} ${isCurrentPlayer ? '<span class="text-notion-accent font-semibold">(你)</span>' : ''}
                </div>
                <div class="inline-flex items-center gap-1 text-[11px] text-notion-muted bg-notion-bg px-2.5 py-1 rounded-full border border-notion-border">
                  <span class="w-2 h-2 rounded-full bg-amber-400"></span> 已送出答案
                </div>
              </div>

              <!-- CARD BACK (Revealed Answer) -->
              <div class="absolute inset-0 w-full h-full rounded-xl border ${isMatch ? 'border-emerald-500 bg-emerald-50/60 shadow-emerald-100' : 'border-notion-border bg-white'} p-4 flex flex-col justify-between items-center text-center shadow-md backface-hidden rotate-y-180">
                <div class="text-[11px] font-semibold text-notion-muted truncate w-full pb-1 border-b border-notion-border/40 flex justify-between items-center">
                  <span>${escapeHtml(name)}</span>
                  ${isMatch ? '<span class="text-[9px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold">默契成功!</span>' : ''}
                </div>
                <div class="font-bold text-base ${isMatch ? 'text-emerald-800 scale-105' : 'text-notion-text'} my-auto break-all px-1 transition-transform">
                  ${escapeHtml(ans)}
                </div>
                <div class="text-[10px] ${isMatch ? 'text-emerald-700 font-bold' : 'text-notion-accent font-medium'}">
                  ${isMatch ? '心電感應達成 🎉' : '心電感應解鎖 ✨'}
                </div>
              </div>

            </div>
          </div>
        `;
      });

      cardsGrid.innerHTML = html;
    }

    // Host Action: Set Question
    hostSetQuestionBtn.addEventListener('click', async () => {
      const q = hostQuestionInput.value.trim();
      if (!q) {
        showToast("請輸入題目內容");
        return;
      }
      await sendAction({ action: 'set_question', question: q });
      hostQuestionInput.value = '';
      showToast("題目已發布！玩家可開始填答");
    });

    // Host Action: Reveal (開牌)
    hostRevealBtn.addEventListener('click', async () => {
      await sendAction({ action: 'reveal' });
      showToast("開牌成功！全網頁同步翻牌");
    });

    // Host Action: Reset (下一輪)
    hostResetBtn.addEventListener('click', async () => {
      await sendAction({ action: 'reset' });
      playerAnswerInput.value = '';
      submittedNotice.classList.add('hidden');
      showToast("已重置房間進入下一輪");
    });

    // Player Action: Submit Answer
    answerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const ans = playerAnswerInput.value.trim();
      if (!ans) return;

      await sendAction({
        action: 'submit_answer',
        playerName: playerName,
        answer: ans
      });

      showToast("答案已成功送出！");
    });

    // Toast Notification helper
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    // Escape HTML helper
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
